      de:
        [
          neugierig,
          schauen,
          gucken,
          wer,
          was,
          steckbrief,
          kennenlernen,
          persoenlich,
        ]
      en: [curious, browse, look, who, what, interested, personal, about]
  - id: learn
    label: { de: "Wie ist das hier gebaut?", en: "How is this built?" }
    clickable: true
    fields: []
    keywords:
      de:
        [
          wie,
          gebaut,
          technik,
          stack,
          code,
          entwicklung,
          astro,
          spec,
          transparenz,
        ]
      en: [how, built, tech, stack, code, development, astro, spec, transparent]
  - id: agent
    label: { de: "Für Maschinen", en: "For machines" }
    clickable: false
    fields: []
    keywords:
      de: []
      en: []
