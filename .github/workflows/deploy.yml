name: Deploy

# SPEC §9: GitHub Actions → GitHub Pages.
# Schritte: Schema-Validierung → Build → Tests (SPEC §10) → Deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema-Validierung (SPEC §9)
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Playwright installieren
        run: npx playwright install --with-deps chromium
      # SPEC §10: Viewport-Matrix + Agenten-Ausgaben (P1) validieren.
      - name: Tests (SPEC §10)
        run: npx playwright test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # SPEC §10: Lighthouse mobil (Perf ≥ 90, LCP ≤ 2,5 s). Warn-Assertions als Signal,
  # blockiert das Deploy nicht (deploy hängt nur an build). Läuft als CI-Action, damit
  # keine schwere lokale Dependency (SPEC §13.4) nötig ist; Config in lighthouserc.json.
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lighthouse (SPEC §10)
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
